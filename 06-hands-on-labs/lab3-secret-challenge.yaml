---
# TODO 3: Pod tanımını tamamla
apiVersion: v1
kind: Pod
metadata:
  name: lab3-app
  namespace: lab3-secrets
  labels:
    lab: "3"
spec:
  serviceAccountName: app-sa
  containers:
    - name: app
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        # TODO: DB_HOST env var olarak ekle (secretKeyRef kullan)
        # - name: DB_HOST
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_HOST

        # TODO: DB_PASSWORD env var olarak ekle
        # - name: DB_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: app-secrets
        #       key: DB_PASSWORD
      volumeMounts:
        # TODO: TLS sertifikasını /etc/ssl/certs/ dizinine mount et
        # - name: tls-certs
        #   mountPath: /etc/ssl/certs
        #   readOnly: true
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
  volumes:
    # TODO: Secret'ı volume olarak tanımla
    # - name: tls-certs
