# =====================================================
# LAB 3: Secret Management Challenge
# Süre: ~20 dakika
# =====================================================
#
# SENARYO:
#   Bir web uygulaması aşağıdaki bilgilere ihtiyaç duyuyor:
#     - DB_HOST  : veritabanı adresi (env var olarak)
#     - DB_PASSWORD : veritabanı şifresi (env var olarak)
#     - /etc/ssl/certs/app.crt : uygulama TLS sertifikası (dosya olarak)
#
#   Güvenlik gereksinimleri:
#     - Sadece 'app-sa' service account bu secret'a erişebilmeli
#     - Sertifika dosyası read-only mount edilmeli (0400 permission)
#     - Secret değerleri YAML'a düz metin yazılmamalı
#       (oc create secret komutu veya stringData kullan)
#
# GÖREVLER:
#   1. TODO'ları tamamla
#   2. oc new-project lab3-secrets
#   3. oc apply -f lab3-secret-challenge.yaml -n lab3-secrets
#
#   4. Doğrulama:
#      oc exec -it lab3-app -n lab3-secrets -- env | grep DB_
#      oc exec -it lab3-app -n lab3-secrets -- ls -la /etc/ssl/certs/
#
#   5. RBAC doğrula:
#      oc auth can-i get secret app-secrets \
#        --as system:serviceaccount:lab3-secrets:app-sa \
#        -n lab3-secrets            # yes olmalı
#
#      oc auth can-i get secret app-secrets \
#        --as system:serviceaccount:lab3-secrets:default \
#        -n lab3-secrets            # no olmalı
#
#   6. BONUS: Secret rotate et ve pod'un otomatik aldığını gözlemle
#      oc set data secret/app-secrets --from-literal=DB_PASSWORD=YeniSifre123 -n lab3-secrets
#      oc exec -it lab3-app -- cat /etc/app/secret-volume/db-password
# =====================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab3-secrets
---
# TODO 1: app-secrets adında Opaque secret oluştur
# DB_HOST, DB_PASSWORD ve tls-cert içermeli
# Gerçek ortamda: oc create secret generic app-secrets \
#   --from-literal=DB_HOST=db-service.lab3-secrets.svc \
#   --from-literal=DB_PASSWORD=GizliSifre123! \
#   --from-file=app.crt=/path/to/app.crt \
#   -n lab3-secrets
# apiVersion: v1
# kind: Secret
# metadata:
#   name: app-secrets
#   namespace: lab3-secrets
# type: Opaque
# stringData:
#   DB_HOST: "db-service.lab3-secrets.svc"
#   DB_PASSWORD: "GizliSifre123!"          # TODO: gerçek bir şifre koy
#   app.crt: |                             # TODO: gerçek sertifika veya dummy değer
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
---
# Service Account (değiştirilmesi gerekmez)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: lab3-secrets
---
# TODO 2: RBAC - sadece app-sa bu secret'a erişebilsin
