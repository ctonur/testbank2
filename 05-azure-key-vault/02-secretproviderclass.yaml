# Azure Key Vault - SecretProviderClass
# CSI Driver'a hangi Key Vault'tan hangi secret'ları çekeceğini söyler.
# Aynı zamanda bu değerleri Kubernetes Secret olarak sync eder.
#
# Ön koşullar:
#   - secrets-store-csi-driver operatörü kurulu olmalı
#   - azure-key-vault-provider kurulu olmalı
#
# <AZURE_CLIENT_ID>, <KEY_VAULT_NAME>, <AZURE_TENANT_ID> değerlerini doldur:
#   az keyvault show --name <vault-name> --query properties.tenantId -o tsv
#
# Key Vault'ta bu secret'ların var olduğundan emin ol:
#   az keyvault secret set --vault-name <vault> --name database-password --value "Gizli123!"
#   az keyvault secret set --vault-name <vault> --name api-key --value "api-gizli-anahtar"
#
# Çalıştır:
#   oc apply -f 02-secretproviderclass.yaml -n vault-demo
#
# Kontrol:
#   oc get secretproviderclass -n vault-demo
#   oc describe secretproviderclass azure-keyvault-secrets -n vault-demo
# ---------------------------------------------------------------
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets
  namespace: vault-demo
  labels:
    demo: azure-key-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<AZURE_CLIENT_ID>"           # Managed Identity Client ID
    keyvaultName: "<KEY_VAULT_NAME>"        # Azure Key Vault adı (sadece isim, URL değil)
    objects: |
      array:
        - |
          objectName: database-password     # Key Vault'taki secret adı
          objectType: secret
          objectVersion: ""                 # Boş = en son versiyon
        - |
          objectName: api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: tls-certificate
          objectType: cert                  # Sertifika tipi
          objectVersion: ""
    tenantId: "<AZURE_TENANT_ID>"           # Azure AD Tenant ID
  # Bu bölüm Key Vault secret'larını aynı zamanda K8s Secret olarak sync eder
  # Pod volume mount olmasa bile bu K8s secret'ı kullanılabilir
  secretObjects:
    - secretName: app-secrets-from-vault   # Oluşturulacak K8s Secret adı
      type: Opaque
      data:
        - objectName: database-password
          key: db-password
        - objectName: api-key
          key: api-key
