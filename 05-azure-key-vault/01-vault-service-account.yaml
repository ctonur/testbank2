# Azure Key Vault - Workload Identity Service Account
# OIDC Federated Identity için annotate edilmiş service account.
# Azure AD'de kayıtlı bir Managed Identity'e bağlanır.
#
# Ön koşullar:
#   1. OpenShift OIDC provider'ı Azure AD'de federated identity olarak kayıtlı olmalı
#   2. Azure Key Vault'ta 'Key Vault Secrets User' RBAC rolü bu client-id'ye atanmış olmalı
#
# <AZURE_CLIENT_ID> ve <AZURE_TENANT_ID> değerlerini gerçek değerlerle değiştir:
#   az account show --query tenantId -o tsv           -> TENANT_ID
#   az identity show --name <identity-name> --query clientId -o tsv -> CLIENT_ID
#
# Çalıştır:
#   oc new-project vault-demo
#   oc apply -f 01-vault-service-account.yaml
#
# Kontrol:
#   oc get sa vault-workload-sa -n vault-demo -o yaml
# ---------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-workload-sa
  namespace: vault-demo
  labels:
    demo: azure-key-vault
  annotations:
    # Azure Workload Identity annotasyonları
    azure.workload.identity/client-id: "<AZURE_CLIENT_ID>"     # Managed Identity Client ID
    azure.workload.identity/tenant-id: "<AZURE_TENANT_ID>"     # Azure AD Tenant ID
