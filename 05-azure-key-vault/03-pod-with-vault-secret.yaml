# Azure Key Vault - Pod ile Secret Mount
# Azure Key Vault secret'larını doğrudan pod'a mount eder.
# Workload Identity ile credential gerekmez (zero-trust).
#
# Önce şunları yap:
#   oc apply -f 01-vault-service-account.yaml
#   oc apply -f 02-secretproviderclass.yaml
#
# Çalıştır:
#   oc apply -f 03-pod-with-vault-secret.yaml -n vault-demo
#
# Kontrol:
#   oc get pods -n vault-demo
#   oc exec -it vault-secret-pod -n vault-demo -- ls /mnt/secrets
#   oc exec -it vault-secret-pod -n vault-demo -- cat /mnt/secrets/database-password
#
#   # K8s Secret olarak sync edildi mi?
#   oc get secret app-secrets-from-vault -n vault-demo
#   oc get secret app-secrets-from-vault -o jsonpath='{.data.db-password}' -n vault-demo | base64 -d
#
# AKIŞ:
#   Pod (vault-workload-sa)
#     -> OIDC Token ile Azure AD'ye kimlik doğrula
#     -> Azure AD: "Bu SA bu identity mi? Evet."
#     -> Azure Key Vault: "Bu identity'ye izin var mı? Evet."
#     -> Secret döndür
#     -> CSI Driver pod'a mount eder
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: vault-secret-pod
  namespace: vault-demo
  labels:
    demo: azure-key-vault
    azure.workload.identity/use: "true"    # Workload Identity aktif et
spec:
  serviceAccountName: vault-workload-sa    # OIDC annotasyonlu SA
  containers:
    - name: app
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      command:
        - sh
        - -c
        - |
          echo "=== Azure Key Vault'tan gelen secret'lar ==="
          ls -la /mnt/secrets/
          echo ""
          echo "=== DB Password (ilk 5 karakter) ==="
          cat /mnt/secrets/database-password | cut -c1-5
          echo "..."
          echo ""
          echo "=== K8s Secret Env Var ==="
          echo "DB_PASSWORD env değeri mevcut mu: ${DB_PASSWORD:+EVET}"
          sleep 3600
      env:
        # K8s Secret (SecretProviderClass'ın sync ettiği) üzerinden env var
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets-from-vault    # SecretProviderClass'ın sync ettiği secret
              key: db-password
              optional: true                  # İlk deploy'da secret henüz yoksa pod beklesin
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: vault-secrets
          mountPath: /mnt/secrets    # Key Vault secret'ları bu dizinde dosya olarak görünür
          readOnly: true
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "200m"
  volumes:
    - name: vault-secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: azure-keyvault-secrets    # Hangi SecretProviderClass kullanılsın
