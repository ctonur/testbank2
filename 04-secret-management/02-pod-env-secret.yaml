# Secret - Environment Variable olarak kullanım
# Secret değerleri pod'a environment variable olarak inject edilir.
#
# Önce secret oluştur:
#   oc apply -f 01-opaque-secret.yaml
#
# Çalıştır:
#   oc apply -f 02-pod-env-secret.yaml -n secret-demo
#
# Kontrol:
#   oc exec -it pod-env-secret -n secret-demo -- env | grep -E "DB_|API_"
#
# GÜVENLİK NOTU:
#   Dezavantajlar:
#   - 'oc exec' erişimi olan herkes env var görebilir
#   - /proc/<pid>/environ dosyasından leak olabilir
#   - ps aux çıktısında görünebilir (bazı durumlarda)
#   Avantajlar:
#   - Uygulama kodu değişmeden çalışır
#   - 12-factor app uyumlu
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: pod-env-secret
  namespace: secret-demo
  labels:
    demo: secret-env
spec:
  containers:
    - name: app
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      command: ["sh", "-c", "echo 'DB_USER='$DB_USER && echo 'API_KEY başlangıcı='$(echo $API_KEY | cut -c1-8)'...' && sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-credentials       # Secret adı
              key: username               # Secret içindeki key
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: password
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: api-key
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
