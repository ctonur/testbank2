# TLS Secret - HTTPS için sertifika ve anahtar
# Ingress/Route TLS termination veya uygulama içi mTLS için kullanılır.
#
# Gerçek sertifika ile oluşturmak için:
#   oc create secret tls tls-cert \
#     --cert=/path/to/tls.crt \
#     --key=/path/to/tls.key \
#     -n secret-demo
#
# Self-signed test sertifikası oluşturmak için:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key \
#     -out tls.crt \
#     -subj "/CN=myapp.example.com/O=Demo"
#
# Kontrol:
#   oc get secret tls-cert -n secret-demo -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -text
# ---------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: tls-cert
  namespace: secret-demo
  labels:
    demo: secret-tls
type: kubernetes.io/tls
# Bu değerler gerçek bir sertifika DEĞİLDİR - sadece format göstermek için
# Gerçek ortamda openssl veya cert-manager ile oluşturun
data:
  # base64 encode edilmiş değerler (gerçek sertifika ile değiştirin)
  tls.crt: 
  tls.key: 
