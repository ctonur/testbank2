# Secret Management - Opaque Secret
# Uygulama kimlik bilgileri: username, password, api-key.
#
# ÖNEMLİ: Bu değerler base64 ile encode edilmiş - şifreli DEĞİL!
#   echo -n "appuser" | base64           -> YXBwdXNlcg==
#   echo -n "S3cur3P@ssw0rd!" | base64  -> UzNjdXIzUEBzc3cwcmQh
#
# Daha güvenli oluşturma yöntemi (YAML'a şifre yazmadan):
#   oc create secret generic app-credentials \
#     --from-literal=username=appuser \
#     --from-literal=password=S3cur3P@ssw0rd! \
#     --from-literal=api-key=my-secret-key \
#     -n secret-demo
#
# Kontrol:
#   oc get secret app-credentials -n secret-demo -o yaml
#   oc get secret app-credentials -o jsonpath='{.data.username}' -n secret-demo | base64 -d
# ---------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: secret-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: secret-demo
  labels:
    demo: secret-management
type: Opaque
# stringData: düz metin yazar, Kubernetes otomatik base64 yapar
stringData:
  username: appuser
  password: S3cur3P@ssw0rd!
  api-key: "my-super-secret-api-key-12345"
  database-url: "postgresql://appuser:S3cur3P@ssw0rd!@db-service:5432/appdb"
