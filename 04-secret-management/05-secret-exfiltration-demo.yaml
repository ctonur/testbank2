# !! GÜVENLİK EĞİTİMİ - Secret Exfiltration Demo !!
# Bu pod, yanlış RBAC yapılandırması olmadan default SA'nın sınırlı yetkisini gösterir.
# Amacı: Service Account token ile API'ye erişim denemesi ve neden RBAC önemlidir.
#
# Çalıştır:
#   oc apply -f 05-secret-exfiltration-demo.yaml -n secret-demo
#
# Pod içinde interaktif keşif:
#   oc exec -it secret-reader-pod -n secret-demo -- sh
#
# Pod içinde dene:
#   TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
#   APISERVER=https://kubernetes.default.svc
#   NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
#
#   # Secret listesine erişmeye çalış (BAŞARISIZ - 403)
#   curl -sk $APISERVER/api/v1/namespaces/$NAMESPACE/secrets \
#     -H "Authorization: Bearer $TOKEN"
#
#   # Pod listesine erişmeye çalış (BAŞARISIZ - 403)
#   curl -sk $APISERVER/api/v1/namespaces/$NAMESPACE/pods \
#     -H "Authorization: Bearer $TOKEN"
#
# DERS: Default SA yetersiz yetki ile güvenlidir.
#        Ama yanlışlıkla 'list secrets' yetkisi verilirse ne olur?
#        -> 03-rbac-fundamentals/05-app-service-account-rbac.yaml ile karşılaştır
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: secret-reader-pod
  namespace: secret-demo
  labels:
    demo: secret-exfiltration
  annotations:
    purpose: "Egitim amacli - RBAC yoklugunun ne kadar onemli oldugunu gostermek icin"
spec:
  # serviceAccountName belirtilmedi = 'default' SA kullanılır
  # default SA'nın genelde secret okuma yetkisi yoktur (güvenli)
  automountServiceAccountToken: true    # Token mount edildi - demo için
  containers:
    - name: reader
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      command:
        - sh
        - -c
        - |
          echo "=== Service Account Token Bilgisi ==="
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          echo "Namespace: $NAMESPACE"
          echo "Token (ilk 30 karakter): $(echo $TOKEN | cut -c1-30)..."
          echo ""
          echo "=== API Server'a erişim denemesi ==="
          APISERVER=https://kubernetes.default.svc
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          echo "Secrets listesine erişmeye çalışıyorum..."
          curl -s --cacert $CA $APISERVER/api/v1/namespaces/$NAMESPACE/secrets \
            -H "Authorization: Bearer $TOKEN" | head -5
          echo ""
          echo "Beklenen sonuç: 403 Forbidden"
          sleep 3600
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
