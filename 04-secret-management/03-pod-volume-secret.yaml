# Secret - Volume olarak mount etme (Önerilen yöntem)
# Secret değerleri pod içinde dosya olarak /etc/app/secrets/ altına mount edilir.
#
# Önce secret oluştur:
#   oc apply -f 01-opaque-secret.yaml
#
# Çalıştır:
#   oc apply -f 03-pod-volume-secret.yaml -n secret-demo
#
# Kontrol:
#   oc exec -it pod-volume-secret -n secret-demo -- ls /etc/app/secrets
#   oc exec -it pod-volume-secret -n secret-demo -- cat /etc/app/secrets/username
#   oc exec -it pod-volume-secret -n secret-demo -- stat /etc/app/secrets/username
#
# AVANTAJLAR (env var'a göre):
#   - defaultMode: 0400 ile dosya sadece sahibi tarafından okunabilir
#   - Secret rotate edilince pod restart gerekmeden dosya güncellenir
#   - Memory'de değil, tmpfs'te tutulur
#   - ps aux veya /proc/env'de görünmez
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: pod-volume-secret
  namespace: secret-demo
  labels:
    demo: secret-volume
spec:
  containers:
    - name: app
      image: registry.access.redhat.com/ubi8/ubi-minimal:latest
      command: ["sh", "-c", "ls -la /etc/app/secrets && cat /etc/app/secrets/username && sleep 3600"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: credentials-volume
          mountPath: /etc/app/secrets    # Secret dosyaları burada görünür
          readOnly: true                 # Salt okunur mount
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
  volumes:
    - name: credentials-volume
      secret:
        secretName: app-credentials    # Hangi secret mount edilsin
        defaultMode: 0400              # Sadece sahip okuyabilir (owner read-only)
        # İsteğe bağlı: sadece belirli key'leri mount et
        items:
          - key: username
            path: username
          - key: password
            path: password
          - key: api-key
            path: api-key
