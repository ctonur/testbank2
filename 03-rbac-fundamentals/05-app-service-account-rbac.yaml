# RBAC - Service Account + Kısıtlı Secret Erişimi
# app-service-account sadece 'app-config-secret' adlı secret'ı okuyabilir.
# Diğer secret'lara erişimi yoktur.
# Bu 'resourceNames' ile Least Privilege uygulamasının örneğidir.
#
# Çalıştır:
#   oc apply -f 05-app-service-account-rbac.yaml -n rbac-demo
#
# Kontrol:
#   oc auth can-i get secret app-config-secret \
#     --as system:serviceaccount:rbac-demo:app-service-account \
#     -n rbac-demo       # yes
#
#   oc auth can-i get secret other-secret \
#     --as system:serviceaccount:rbac-demo:app-service-account \
#     -n rbac-demo       # no
#
#   oc auth can-i list secrets \
#     --as system:serviceaccount:rbac-demo:app-service-account \
#     -n rbac-demo       # no  (list bile yok!)
# ---------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: rbac-demo
  labels:
    demo: rbac-least-privilege
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: specific-secret-reader
  namespace: rbac-demo
  labels:
    demo: rbac-least-privilege
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]                       # Sadece get (list yok - tüm secret listesi görülemesin)
    resourceNames:
      - app-config-secret                # Sadece bu spesifik secret'a erişim
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-sa-secret-binding
  namespace: rbac-demo
  labels:
    demo: rbac-least-privilege
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: rbac-demo
roleRef:
  kind: Role
  name: specific-secret-reader
  apiGroup: rbac.authorization.k8s.io
