# Demo 3 - Service Account Oluşturma
# SCC Assignment Lab için kullanılacak service account.
#
# Çalıştır:
#   oc apply -f 03-demo-service-account.yaml
#
# Sonrasında anyuid SCC ver:
#   oc adm policy add-scc-to-user anyuid -z demo-sa -n security-demo
#
# Kontrol:
#   oc adm policy who-can use scc anyuid
# ---------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-sa
  namespace: security-demo
  labels:
    demo: scc-assignment
  annotations:
    description: "SCC assignment demo service account - anyuid yetkisi verilecek"
