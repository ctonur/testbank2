# Demo 1 - Root Container Reddi
# Bu pod OpenShift'te ÇALIŞMAYACAK.
# SCC restricted-v2, UID 0 (root) ile çalıştırmaya izin vermez.
#
# Çalıştır:
#   oc apply -f 01-root-pod-rejected.yaml -n security-demo
#
# Beklenen hata:
#   pods "root-pod-rejected" is forbidden:
#   unable to validate against any security context constraint
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: root-pod-rejected
  namespace: security-demo
  labels:
    demo: scc-rejection
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
      securityContext:
        runAsUser: 0           # ROOT - SCC tarafından reddedilir
        allowPrivilegeEscalation: true
