# Demo 2 - Non-Root Pod (Çalışan Örnek)
# Bu pod OpenShift'te ÇALIŞACAK.
# restricted-v2 SCC şartlarına uygun: non-root, privilege escalation yok.
#
# Çalıştır:
#   oc apply -f 02-non-root-pod.yaml -n security-demo
#
# Kontrol:
#   oc get pods -n security-demo
#   oc get pod non-root-pod -o jsonpath='{.metadata.annotations.openshift\.io/scc}' -n security-demo
#   Beklenen SCC: restricted-v2
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: non-root-pod
  namespace: security-demo
  labels:
    demo: scc-pass
spec:
  containers:
    - name: nginx
      image: bitnami/nginx:latest     # Non-root image (UID 1001 ile çalışır)
      ports:
        - containerPort: 8080
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001               # Root değil
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL                     # Tüm Linux capabilities kaldırıldı
